<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 320px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 20px;
      color: #1a1a1a;
      background: #fafafa;
    }

    h1 {
      font-size: 16px;
      font-weight: 600;
      text-align: center;
      margin-bottom: 16px;
      color: #0d9488;
    }

    .field {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 4px;
      color: #374151;
    }

    input {
      width: 100%;
      padding: 8px 10px;
      font-size: 13px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      outline: none;
      transition: border-color 0.15s;
      background: #fff;
    }

    input:focus {
      border-color: #0d9488;
      box-shadow: 0 0 0 2px rgba(13, 148, 136, 0.12);
    }

    .hint {
      font-size: 11px;
      color: #6b7280;
      margin-top: 3px;
    }

    .buttons {
      display: flex;
      gap: 8px;
      margin-top: 18px;
    }

    button {
      flex: 1;
      padding: 9px 12px;
      font-size: 13px;
      font-weight: 500;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: opacity 0.15s, background-color 0.15s;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #scrapeBtn {
      background-color: #0d9488;
      color: #fff;
    }

    #scrapeBtn:hover:not(:disabled) {
      background-color: #0f766e;
    }

    #copyBtn {
      background-color: #e5e7eb;
      color: #374151;
    }

    #copyBtn:hover:not(:disabled) {
      background-color: #d1d5db;
    }

    #status {
      margin-top: 14px;
      font-size: 12px;
      padding: 8px 10px;
      border-radius: 6px;
      display: none;
      line-height: 1.4;
    }

    #status.success {
      display: block;
      background: #d1fae5;
      color: #065f46;
    }

    #status.error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    #status.info {
      display: block;
      background: #e0f2fe;
      color: #075985;
    }

    #status.warning {
      display: block;
      background: #fef9c3;
      color: #854d0e;
    }
  </style>
</head>
<body>
  <h1>Cambly Transcript Scraper</h1>

  <div class="field">
    <label for="studentName" data-i18n="labelStudentName">学生姓名</label>
    <input type="text" id="studentName" data-i18n-placeholder="placeholderStudentName" placeholder="Student Name">
  </div>

  <div class="field">
    <label for="saveFolder" data-i18n="labelSaveFolder">保存文件夹</label>
    <input type="text" id="saveFolder" placeholder="cambly-lessons">
    <div class="hint" data-i18n="hintSaveFolder">Downloads 中的子文件夹，留空则保存到 Downloads 根目录</div>
  </div>

  <div class="buttons">
    <button id="scrapeBtn" data-i18n="btnScrape">抓取并保存</button>
    <button id="copyBtn" data-i18n="btnCopy">复制到剪贴板</button>
  </div>

  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
